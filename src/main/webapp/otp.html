<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot password</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/forgot.css">
</head>
<body>
     <nav class="top-nav">
        <div class="nav-left">
        <div class="menu-icon" onclick="toggleSidebar()">&#9776;</div>
        <div class="logo-container">
            <img src="images/navlogo (2).jpeg" alt="Achievo Logo">
        </div>
        </div>
    </nav>

    <div id="mySidebar" class="sidebar">
        <a href="start.html">Home</a>
        <a href="mock.html">Mock Tests</a>
        <a href="studymaterial.html">Study Material</a>
        <a href="settings.html">Settings</a>
    </div>
    <div class="auth-container">
    <div class="auth-card">
        <h2>Enter OTP</h2>
        <p>Enter OTP to reset your password</p>
        
        <p id="timer" style="color:red; font-weight:bold;">OTP expires in 60 seconds</p>
        <form action="VerifyOtpServlet" method="POST">
            <div class="input-group">
                <input type="text" name="otp" placeholder="Enter OTP" required>
            </div><br>
            <button type="submit" class="auth-btn">Confirm</button>
        </form>
    </div>
</div>
<script src="forgot.js"></script>
   <script>
        let time = 60;

        let timer = setInterval(function () {
            time--;

            document.getElementById("timer").innerText =
                "OTP expires in " + time + " seconds";

            if (time <= 0) {
                clearInterval(timer);
                alert("OTP expired!");

                // Disable button (optional but good UX)
                document.querySelector(".auth-btn").disabled = true;

                // Redirect back
                window.location.href = "forgot.html";
            }
        }, 1000);
    </script>
</body>
</html>
