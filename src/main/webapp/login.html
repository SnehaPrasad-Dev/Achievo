<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/login.css">
    
</head>
<body>
    <nav class="top-nav">
        <div class="nav-left">
        <div class="menu-icon" onclick="toggleSidebar()">&#9776;</div>
        <div class="logo-container">
            <img src="images/navlogo (2).jpeg" alt="Achievo Logo">
        </div>
        </div>
        <div class="nav-buttons">
            <button class="login" onclick="window.location.href='login.html'">Login</button>
            <button class="register" onclick="window.location.href='register.html'">Register</button>
        </div>
    </nav>

    <!-- LOGIN BOX -->
<div class="container">
    <div class="login-card">
        <h2>Login</h2>
        <p>Login to your account!</p><br>

    <form action="LoginServlet" method="POST" id="loginForm">
        <div class="input-group">
                <input type="email" name="email" placeholder="Enter your Email" required>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Enter your Password" required>
            </div>

            

            <div class="options">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="forgot.html">Forgot Password?</a>
            </div>

            <button type="submit" class="login-now-btn">Login Now</button>
    </form>

    <p class="reg-text">Don't have an account? <a href="register.html">Register</a></p>
</div>

<script src="login.js"></script>
<script src="home.js"></script>
</body>
</html>
