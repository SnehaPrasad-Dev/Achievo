<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Achievo</title>
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>

    <nav class="top-nav">
        <div class="menu-icon" onclick="toggleSidebar()">&#9776;</div>
        <div class="logo-container">
            <img src="images/navlogo (2).jpeg" alt="Achievo Logo">
        </div>
    </nav>

    <div id="mySidebar" class="sidebar">
        <a href="start.html">Home</a>
        <a href="mock.html">Mock Tests</a>
        <a href="studymaterial.html">Study Material</a>
        <a href="settings.html">Settings</a>
    </div>

    <div id="main">
        <div class="settings-wrapper">
            <div class="settings-header">
                <h1>Settings</h1>
                <p>Choose the settings you want to manage.</p>
            </div>

            <div class="settings-grid">
                <div class="setting-card">
                    <div class="blank-icon-circle"></div>
                    <h3>Personal Info</h3>
                    <p>Manage your account information</p>
                    <button onclick="location.href='editprofile.jsp'" class="auth-btn">Update Info</button>
                </div>

                <div class="setting-card">
                    <div class="blank-icon-circleS"></div>
                    <h3>Security</h3>
                    <p>Change your password and secure your account</p>
                    <button onclick="location.href='security.html'" class="auth-btn">Manage Security</button>
                </div>
            </div>
        </div>
    </div>

    <script src="settings.js"></script>
</body>
</html>
